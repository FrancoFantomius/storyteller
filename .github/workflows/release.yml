name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package.json version
        id: check_version
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
            echo "Error: Unable to parse version from package.json."
            exit 1
          fi

          # Verify if git tag already exists
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "Tag v$CURRENT_VERSION already exists. Skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version 2>/dev/null || echo "")
            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              echo "Version changed from '$PREV_VERSION' to '$CURRENT_VERSION'."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version has not changed. Skipping release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase repository name
        if: steps.check_version.outputs.changed == 'true'
        id: repo
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Storyteller App image
        if: steps.check_version.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:v${{ steps.check_version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest

      - name: Create GitHub Release and generate release notes
        if: steps.check_version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.check_version.outputs.version }}" \
            --title "v${{ steps.check_version.outputs.version }}" \
            --generate-notes
